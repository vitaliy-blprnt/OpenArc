name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate pinned inputs and patch series
        run: python3 scripts/openarc.py check
      - name: Test tooling safety and repeatability
        run: python3 -m unittest discover -s tests/tooling -p 'test_*.py' -v
      - name: Test extension probe resource guards
        run: node --test tests/extensions/platform-probe/scope.test.mjs
      - name: Check whitespace
        run: git show --check --format= HEAD

# These jobs validate the source tooling. They do not build Chromium or certify
# browser behavior. Full macOS builds need a separately provisioned runner;
# signing credentials must never be exposed to untrusted pull-request code.
